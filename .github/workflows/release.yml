name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# A newer merge supersedes a release still building.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build app and DMG
        run: |
          scripts/bundle.sh
          scripts/dmg.sh
          mv build/Pluck.dmg "build/Pluck-$VERSION.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/Pluck-$VERSION.dmg" \
            --target "$GITHUB_SHA" \
            --title "Pluck $VERSION" \
            --generate-notes
